name: Mirror lab2 to public

on:
  push:
    paths:
      - 'labs/lab2/lab/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          fetch-depth: 0

      - name: Clean old subtree refs
        run: |
          git fetch --all --tags
          git for-each-ref --format='delete %(refname)' refs/subtree-split/ | git update-ref --stdin || true
          git reflog expire --expire=now --all
          git gc --prune=now

      - name: Push subtree to public repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add document-indexer https://github.com/afadel151/document-indexer.git || true
          git remote -v
          echo "Pushing labs/lab2/lab subtree to document-indexer..."
          git subtree split --prefix=labs/lab2/lab -b lab2-split
          git push --force document-indexer lab2-split:main
